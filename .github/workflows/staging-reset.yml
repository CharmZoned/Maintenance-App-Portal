name: Reset staging data

# Wipes the STAGING Supabase database and re-seeds the demo world
# (docs/adr/0007-staging-data-and-seeding.md). Started by hand only:
# Actions -> "Reset staging data" -> Run workflow -> branch `staging`.
#
# It cannot touch production: scripts/staging/guard.ts refuses unless the
# configured project is not the production one AND matches the ref typed below.
#
# Repository secrets (Settings -> Secrets and variables -> Actions):
#   STAGING_SUPABASE_URL      https://<staging-ref>.supabase.co
#   STAGING_SERVICE_ROLE_KEY  staging service_role (or secret) API key
#   STAGING_DB_URL            staging SESSION POOLER connection string (port 5432);
#                             GitHub runners are IPv4-only, the direct host is IPv6
#   STAGING_DEMO_PASSWORD     password for the demo logins, 16+ characters
#   STAGING_ANON_KEY          optional: staging publishable/anon key; turns on the sign-in check
#   STAGING_DB_CA_CERT        optional: Supabase CA certificate (PEM) to verify the database server
on:
  workflow_dispatch:
    inputs:
      staging_project_ref:
        description: "Type the STAGING Supabase project ref to confirm (20 lowercase letters). All staging data and logins will be replaced."
        required: true
        type: string

# One reset at a time; a second run waits for the first instead of overlapping it.
concurrency:
  group: staging-reset
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reset:
    name: Reset staging data
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Wipe and re-seed staging
        env:
          CONFIRM_STAGING_REF: ${{ inputs.staging_project_ref }}
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SERVICE_ROLE_KEY }}
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
          STAGING_DEMO_PASSWORD: ${{ secrets.STAGING_DEMO_PASSWORD }}
          STAGING_ANON_KEY: ${{ secrets.STAGING_ANON_KEY }}
          STAGING_DB_CA_CERT: ${{ secrets.STAGING_DB_CA_CERT }}
        run: pnpm staging:seed

  # Started from any other branch, the job above is skipped; say why instead of
  # leaving a run that looks like it did something.
  wrong-branch:
    name: Wrong branch
    if: github.ref != 'refs/heads/staging'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Only the staging branch may reset staging
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "::error::Reset staging data must be run from the staging branch (got ${REF_NAME}). Nothing was changed."
          exit 1
