name: CI

# Runs on every change to staging and master, including docs-only changes.
# These jobs are required status checks; a required check that is skipped by a
# path filter never reports, which leaves the pull request unmergeable.
on:
  pull_request:
    branches: [staging, master]
  push:
    branches: [staging, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: typecheck / build / test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and build
        run: pnpm typecheck & tp=$!; pnpm build & bp=$!; wait $tp && wait $bp

      - name: Test
        run: pnpm test

  # Production (master) only ever receives the release pull request from staging.
  # See docs/adr/0001-environments-and-promotion.md.
  release-source:
    name: release source
    if: github.event_name == 'pull_request' && github.base_ref == 'master'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Only staging may merge into master
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_REPO" != "$BASE_REPO" ] || [ "$HEAD_REF" != "staging" ]; then
            echo "::error::Pull requests into master must come from this repository's staging branch (got ${HEAD_REPO}:${HEAD_REF}). Target staging instead."
            exit 1
          fi
          echo "Release pull request from staging - OK."
